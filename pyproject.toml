[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-meeting-pipeline"
version = "0.1.0"
description = "Server-side meeting transcription, diarization, and summarization pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
asr-pipeline = "src.cli.pipeline:main"
asr-transcribe = "src.cli.transcribe:main"
asr-diarize = "src.cli.diarize:main"
asr-summarize = "src.cli.summarize:main"
asr-api = "src.api.server:main"

[dependency-groups]
transcribe = [
  "huggingface-hub>=0.34,<1.0",
  "qwen-asr>=0.0.6,<0.1",
]
diarize = [
  "huggingface-hub>=0.34,<1.0",
  "pyannote.audio>=4.0,<5.0",
]
summarize = []
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["prompts/*.txt"]
